name: nastack-trading-next

# Isolated development server. Keep the existing 8080 installation untouched.
x-app: &app
  build: .
  image: nastack-trading:next-local
  env_file: .env.next
  environment:
    TRADING_DATABASE_URL: postgresql+psycopg://nastack:${NEXT_POSTGRES_PASSWORD:?Set NEXT_POSTGRES_PASSWORD in .env.next}@postgres:5432/nastack_trading
    TRADING_LIVE_ORDERS_ENABLED: "false"
    TRADING_AUTOMATIC_ORDERS_ENABLED: "false"
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nastack_trading
      POSTGRES_USER: nastack
      POSTGRES_PASSWORD: ${NEXT_POSTGRES_PASSWORD:?Set NEXT_POSTGRES_PASSWORD in .env.next}
    volumes:
      - next_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nastack -d nastack_trading"]
      interval: 5s
      timeout: 3s
      retries: 30
  init:
    <<: *app
    restart: "no"
    command: ["python", "-m", "nastack_trading.installation"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *app
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 20
  worker:
    <<: *app
    command: ["python", "-m", "nastack_trading.worker"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  next_postgres:
